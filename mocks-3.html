<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Devi Minimal Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}
/* Layout: quiet two-door store. Women and Men are the only top-level choice; each opens onto a row of
   category tabs ending in Premium. Hairline rules, square-ish tiles, one slate-blue dot from the Devi logo. */
:root{
  --bg:#F5F4F0; --surface:#FBFAF7; --tile:#ECEBE6; --tile-2:#E4E3DD;
  --ink:#23252B; --ink-2:#5E6067; --ink-3:#8D8E92;
  --line:#DCDAD3; --rule:#A9A7A1;
  --accent:#4D5D86; --on-ink:#F7F6F2; --sale:#A8423E; --good:#3E7A5A; --warn:#A5552F;
  --f-display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:4px; --maxw:1200px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1B1F; --surface:#212227; --tile:#28292F; --tile-2:#303238;
  --ink:#ECEAE4; --ink-2:#ADACA7; --ink-3:#83837F;
  --line:#34353B; --rule:#5C5C5A;
  --accent:#93A2CC; --on-ink:#1A1B1F; --sale:#E8928A; --good:#7CC39C; --warn:#E39A76;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1B1F; --surface:#212227; --tile:#28292F; --tile-2:#303238;
  --ink:#ECEAE4; --ink-2:#ADACA7; --ink-3:#83837F;
  --line:#34353B; --rule:#5C5C5A;
  --accent:#93A2CC; --on-ink:#1A1B1F; --sale:#E8928A; --good:#7CC39C; --warn:#E39A76;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;line-height:1.05;text-wrap:balance}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:clamp(16px,3.2vw,40px)}
.label{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.link{background:none;border:0;padding:0 0 1px;border-bottom:1px solid var(--rule);font-size:13px;color:var(--ink)}
.link:hover{border-color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:var(--r);border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);padding:14px 24px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.line{background:transparent;color:var(--ink)}
.btn.sm{padding:9px 14px;font-size:11.5px}
.btn.block{width:100%}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"nav brand icons";align-items:center;height:68px;gap:16px}
.nav{grid-area:nav;display:flex;gap:28px}
.nav a{font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--ink-2);position:relative;padding:6px 0}
.nav a:hover,.nav a.on{color:var(--ink)}
.nav a.on::after{content:"";position:absolute;left:50%;bottom:-4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.brand{grid-area:brand;display:flex;flex-direction:column;align-items:center;gap:3px}
.brand .wm{font-family:var(--f-display);font-size:24px;letter-spacing:.38em;padding-left:.38em;line-height:1}
.brand svg{width:44px;height:6px}
.icons{grid-area:icons;justify-self:end;display:flex;gap:2px}
.hicon{width:38px;height:38px;border-radius:50%;border:0;background:none;display:grid;place-items:center;position:relative;color:var(--ink);padding:0}
.hicon:hover{background:var(--tile)}
.hicon svg{width:19px;height:19px}
.badge{position:absolute;top:2px;right:0;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.badge[data-n="0"]{display:none}
.searchbar{border-top:1px solid var(--line);padding-block:14px}
.searchbar form{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ink);padding:4px 0}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:18px;padding:6px 0}
@media (max-width:620px){
  .hdr-in{grid-template-columns:auto 1fr;grid-template-areas:"brand icons" "nav nav";height:auto;padding-block:12px 0;row-gap:4px}
  .brand{align-items:flex-start}
  .nav{gap:24px;padding-bottom:8px}
  .hicon{width:34px;height:34px}
}

main{min-height:70vh}
.page{padding-block:28px 80px}

/* home */
.intro{text-align:center;padding-block:36px 36px}
.intro h1{font-size:clamp(34px,5vw,60px)}
.intro p{max-width:50ch;margin:14px auto 0;color:var(--ink-2)}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.door-art{display:block;background:var(--tile);aspect-ratio:1/.9;border-radius:var(--r);position:relative;overflow:hidden;transition:background .2s}
.door-art:hover{background:var(--tile-2)}
.door-art svg{position:absolute;top:8%;height:86%;width:46%}
.door-art svg.a{left:6%}
.door-art svg.b{right:6%}
.door-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;padding-top:16px}
.door-meta h2{font-size:clamp(34px,4vw,46px)}
.door-meta h2 a:hover{color:var(--accent)}
.door-cats{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13.5px;color:var(--ink-2);width:100%}
.door-cats a:hover{color:var(--ink)}
.door-cats a.prem{color:var(--accent)}
@media (max-width:720px){.doors{grid-template-columns:1fr;gap:36px}}
.row-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;margin:72px 0 22px;padding-top:22px;border-top:1px solid var(--line)}
.row-head h2{font-size:clamp(28px,3vw,36px)}
.row-head p{margin:4px 0 0;font-size:14px;color:var(--ink-2);max-width:56ch}
.row-head .links{display:flex;gap:18px}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 16px}
@media (max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 10px}}
.card{min-width:0;display:flex;flex-direction:column}
.card .phw{position:relative}
.card .ph{position:relative;display:block;background:var(--tile);aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;transition:background .2s}
.card .ph:hover{background:var(--tile-2)}
.card .ph svg{position:absolute;inset:8% 10% 5%;width:80%;height:87%}
.card .heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2);z-index:2}
.card .heart:hover{background:var(--surface);color:var(--ink)}
.heart svg,.wish svg{width:17px;height:17px}
.heart.on,.wish.on{color:var(--sale)}
.heart.on svg path,.wish.on svg path{fill:currentColor}
.card .info{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:12px}
.card .nm{font-size:14px;line-height:1.35}
.card .nm:hover{text-decoration:underline;text-underline-offset:3px}
.card .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.card .pr{font-size:14px;white-space:nowrap;text-align:right}
.card .pr s{display:block;color:var(--ink-3);font-size:12px}
.ptag{color:var(--accent);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
@media (max-width:640px){.card .info{flex-direction:column;gap:2px}.card .pr{text-align:left;order:3}.card .pr s{display:inline;margin-right:6px}}
.card .acts{display:flex;gap:16px;margin-top:10px;font-size:12.5px}
.card .acts button{background:none;border:0;padding:0;border-bottom:1px solid var(--rule);color:var(--ink-2)}
.card .acts button:hover{color:var(--ink);border-color:var(--ink)}

/* section page */
.crumbs{display:flex;gap:8px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.crumbs a:hover{color:var(--ink)}
.stitle{display:flex;align-items:baseline;gap:14px;margin-top:14px}
.stitle h1{font-size:clamp(44px,6vw,76px)}
.stitle span{font-size:14px;color:var(--ink-3)}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-top:22px;overflow-x:auto;scrollbar-width:none}
.tab{padding:12px 0;font-size:14px;color:var(--ink-2);border-bottom:1.5px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab .ct{font-size:11.5px;color:var(--ink-3)}
.tab.on{color:var(--ink);border-color:var(--ink)}
.tab.prem::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0 24px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.bar label{display:flex;gap:6px;align-items:center}
.bar select{border:0;background:transparent;font-size:13px;color:var(--ink);padding:4px 2px;cursor:pointer}
.pnote{display:flex;gap:12px;align-items:center;background:var(--tile);padding:16px 18px;border-radius:var(--r);margin-bottom:28px;font-size:14px;color:var(--ink-2)}
.pnote b{color:var(--ink);font-weight:500}
.dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.empty{padding:64px 20px;text-align:center;border:1px dashed var(--rule);border-radius:var(--r);color:var(--ink-2)}
.empty h3{font-size:28px;color:var(--ink);margin-bottom:8px}

/* product page */
.pdp{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);margin-top:20px;align-items:start}
.gal .main{background:var(--tile);aspect-ratio:1/1.08;border-radius:var(--r);display:grid;place-items:center;overflow:hidden}
.gal .main svg{width:76%;height:86%}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumb{width:76px;aspect-ratio:1;background:var(--tile);border:1px solid transparent;border-radius:var(--r);padding:6px;display:grid;place-items:center}
.thumb svg{width:100%;height:100%}
.thumb.on{border-color:var(--ink)}
.info{position:sticky;top:96px}
.info h1{font-size:clamp(32px,3.6vw,46px);margin:10px 0 12px}
.price{font-size:18px}
.price s{color:var(--ink-3);margin-right:10px;font-size:15px}
.price .sale{color:var(--sale)}
.desc{color:var(--ink-2);font-size:14.5px;margin:18px 0 0;max-width:52ch}
.opt{margin-top:28px}
.olab{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:10px}
.olab span{color:var(--ink-3)}
.colors{display:flex;gap:12px;flex-wrap:wrap}
.color{width:26px;height:26px;border-radius:50%;border:1px solid rgba(0,0,0,.15);padding:0}
.color.on{outline:1px solid var(--ink);outline-offset:3px}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.size{min-width:48px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:transparent;font-size:13px}
.size:hover{border-color:var(--ink)}
.size.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.ferr{color:var(--warn);font-size:12.5px;margin-top:8px}
.buy{display:flex;gap:8px;margin-top:28px}
.buy .btn{flex:1}
.wish{width:50px;flex:none;border:1px solid var(--ink);border-radius:var(--r);background:transparent;display:grid;place-items:center;color:var(--ink)}
.facts{margin:32px 0 0;border-top:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;text-align:right}
@media (max-width:820px){.pdp{grid-template-columns:1fr}.info{position:static}.thumb{width:64px}}

/* bag */
.ptitle{font-size:clamp(38px,5vw,60px);margin-top:14px}
.cart{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:48px;align-items:start;margin-top:20px}
.line{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:18px;padding:20px 0;border-bottom:1px solid var(--line);align-items:start}
.line:first-child{border-top:1px solid var(--line)}
.line .ph{background:var(--tile);border-radius:var(--r);aspect-ratio:3/4;display:grid;place-items:center}
.line .ph svg{width:84%;height:88%}
.line .nm{font-size:15px}
.line .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.line .sel{display:flex;gap:12px;margin-top:10px;font-size:12.5px;color:var(--ink-3);flex-wrap:wrap}
.line select{border:1px solid var(--line);background:transparent;border-radius:var(--r);padding:4px 6px;font-size:12.5px}
.line .acts{display:flex;gap:16px;margin-top:12px;font-size:12.5px}
.line .acts button{background:none;border:0;padding:0;border-bottom:1px solid var(--rule);color:var(--ink-2)}
.line .right{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r)}
.qty button{width:32px;height:32px;border:0;background:none;font-size:16px}
.qty span{min-width:22px;text-align:center;font-size:14px}
.summary{border:1px solid var(--line);border-radius:var(--r);padding:24px;position:sticky;top:96px;background:var(--surface)}
.summary h3{font-size:26px;margin-bottom:12px}
.srow{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--ink-2)}
.srow b{color:var(--ink);font-weight:400}
.srow.disc b{color:var(--good)}
.srow.total{border-top:1px solid var(--line);margin-top:10px;padding-top:14px;color:var(--ink);font-size:16px}
.srow.total b{font-weight:500;font-size:18px}
.coupon{display:flex;gap:8px;margin:16px 0 6px}
.coupon input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;background:transparent;text-transform:uppercase;font-size:13px}
.hint{font-size:12.5px;color:var(--ink-3)}
.addr{font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding:14px 0;margin-top:14px}
.addr b{color:var(--ink);font-weight:500}
@media (max-width:880px){.cart{grid-template-columns:1fr}.summary{position:static}}
@media (max-width:520px){.line{grid-template-columns:80px minmax(0,1fr)}.line .right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}
.confirm{max-width:560px;margin:40px auto;text-align:center}
.confirm h1{font-size:46px;margin:14px 0 10px}
.confirm .acts{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}

/* profile */
.prof{display:grid;grid-template-columns:200px minmax(0,1fr);gap:48px;margin-top:28px;align-items:start}
.ptabs{display:flex;flex-direction:column;gap:2px}
.ptabs a{padding:8px 0;font-size:14px;color:var(--ink-2);display:flex;justify-content:space-between}
.ptabs a.on{color:var(--ink);font-weight:500}
.ptabs a.on::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);margin:9px 8px 0 -13px;flex:none}
.ptabs .reset{margin-top:22px;border:0;background:none;padding:0;text-align:left;font-size:12.5px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.panel h2{font-size:30px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px;max-width:620px}
.form .full{grid-column:1/-1}
.field label{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:8px 0;font-size:15px;border-radius:0}
.field input:focus,.field textarea:focus{outline:0;border-color:var(--ink)}
.field textarea{min-height:64px;resize:vertical}
.err{color:var(--warn);font-size:12.5px;margin-top:4px}
.order{border-top:1px solid var(--line);padding:18px 0}
.order:last-child{border-bottom:1px solid var(--line)}
.order .oh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}
.order .st{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500}
.order .st.ok{color:var(--good)}
.order .items{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.order .items a{width:54px;aspect-ratio:3/4;background:var(--tile);border-radius:var(--r);display:grid;place-items:center}
.order .items svg{width:86%;height:90%}
@media (max-width:760px){.prof{grid-template-columns:1fr;gap:20px}.ptabs{flex-direction:row;gap:20px;border-bottom:1px solid var(--line)}.ptabs a.on::before{display:none}.ptabs a.on{border-bottom:1.5px solid var(--ink)}.ptabs .reset{display:none}.form{grid-template-columns:1fr}}

/* footer, toast, modal */
.ftr{border-top:1px dashed var(--rule);margin-top:40px;padding-block:32px;font-size:13px;color:var(--ink-2)}
.ftr-in{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.ftr nav{display:flex;gap:20px;flex-wrap:wrap}
.ftr nav a:hover,.ftr nav button:hover{color:var(--ink)}
.ftr nav{align-items:baseline}
.ftr nav button{background:none;border:0;padding:0;font:inherit;line-height:inherit;color:inherit}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:var(--r);font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:60;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast a{text-decoration:underline}
.modal{position:fixed;inset:0;background:rgba(20,21,24,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:var(--r);padding:26px;max-width:520px;width:100%;max-height:85vh;overflow:auto}
.modal .box h3{font-size:28px}
.tbl{overflow-x:auto;margin-top:14px}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{font-weight:500;color:var(--ink-3);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <div class="hdr-in">
      <nav class="nav" aria-label="Sections">
        <a href="#women" data-nav="women">Women</a>
        <a href="#men" data-nav="men">Men</a>
      </nav>
      <a class="brand" href="#home" aria-label="Devi home">
        <span class="wm">DEVI</span>
        <svg viewBox="0 0 44 6" aria-hidden="true"><path d="M0 3h17M27 3h17" stroke="var(--rule)" stroke-width="1"/><circle cx="22" cy="3" r="2.2" fill="var(--accent)"/></svg>
      </a>
      <div class="icons">
        <button class="hicon" data-act="search" aria-label="Search" aria-expanded="false" aria-controls="searchbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <button class="hicon" data-act="theme" id="themeBtn" aria-label="Switch to dark theme"></button>
        <a class="hicon" href="#profile" aria-label="Profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg></a>

    <pattern id="d${id}" patternUnits="userSpaceOnUse" width="16" height="16" patternTransform="scale(${s})"><circle cx="8" cy="8" r="3" fill="none" stroke="${t}" stroke-width="1.1"/><circle cx="0" cy="0" r="1.2" fill="${t}"/><circle cx="16" cy="16" r="1.2" fill="${t}"/><circle cx="16" cy="0" r="1.2" fill="${t}"/><circle cx="0" cy="16" r="1.2" fill="${t}"/></pattern>
    <pattern id="b${id}" patternUnits="userSpaceOnUse" width="22" height="30" patternTransform="scale(${s})"><path d="M0 4 Q11 16 22 4" fill="none" stroke="${t}" stroke-width="1.3"/><circle cx="11" cy="20" r="2.4" fill="${t}"/><circle cx="4" cy="24" r="1" fill="${t}"/><circle cx="18" cy="24" r="1" fill="${t}"/><path d="M0 28 L22 28" stroke="${t}" stroke-width=".9" stroke-dasharray="2 2"/></pattern>`;
}
const threadFor=hex=>lum(hex)>0.86?mix(hex,"#7f7a6e",0.28):(lum(hex)<0.35?"#F6F2E8":mix(hex,"#ffffff",0.78));

function art(p,colorName,view="front",cls=""){
  const col=(p.colors.find(c=>c.name===colorName)||p.colors[0]).hex;
  const t=threadFor(col), edge=mix(col,"#000000",lum(col)<0.35?0.35:0.16), fold=mix(col,"#000000",0.1), dark=mix(col,"#000000",0.12);
  const id=++uid, sh=SHAPES[p.shape], back=view==="back";
  if(view==="detail"){
    return `<svg class="${cls}" viewBox="0 0 300 360" role="img" aria-label="Close-up of the embroidery"><defs>${patternDefs(id,p.motif,t,2.4,p.mukaish)}<clipPath id="h${id}"><circle cx="150" cy="186" r="118"/></clipPath></defs>
      <circle cx="150" cy="186" r="118" fill="${col}"/><rect width="300" height="360" fill="url(#p${id})" clip-path="url(#h${id})"/>
      <path d="M40 300 Q150 250 260 300" fill="none" stroke="${t}" stroke-width="1.5" stroke-dasharray="4 4" clip-path="url(#h${id})"/>
      <circle cx="150" cy="186" r="124" fill="none" stroke="#B88A57" stroke-width="10"/><circle cx="150" cy="186" r="132" fill="none" stroke="#9B7246" stroke-width="5"/>
      <rect x="138" y="40" width="24" height="18" rx="4" fill="#8E6A42"/><circle cx="150" cy="36" r="7" fill="#7C5B37"/></svg>`;
  }
  let s=`<svg class="${cls}" viewBox="0 0 300 372" role="img" aria-label="${esc(p.name)} in ${esc(colorName||p.colors[0].name)}${back?", back":""}"><defs>${patternDefs(id,p.motif,t,1,p.mukaish)}<clipPath id="c${id}"><path d="${sh.body}"/></clipPath>${sh.pallu?`<clipPath id="k${id}"><path d="${sh.pallu}"/></clipPath>`:""}${sh.pants?`<clipPath id="q${id}"><path d="${sh.pants}"/></clipPath>`:""}</defs>`;
  s+=`<g fill="none" stroke="var(--ink-3)" stroke-width="2.2" stroke-linecap="round"><path d="M150 46 V36 a8 8 0 1 0 -8 -8"/><path d="${sh.drape?"M54 66 L150 46 L246 66 Z":"M100 66 L150 46 L200 66"}"/></g>`;
  if(sh.pants) s+=`<path d="${sh.pants}" fill="${col}" stroke="${edge}" stroke-width="1.3"/><rect x="60" y="${sh.pants.includes("366")?338:334}" width="180" height="30" fill="url(#b${id})" clip-path="url(#q${id})"/>`;
  s+=`<path d="${sh.body}" fill="${col}" stroke="${edge}" stroke-width="1.3" stroke-linejoin="round"/>`;
  s+=`<rect width="300" height="372" fill="url(#p${id})" opacity="${back?.2:sh.drape?.85:.5}" clip-path="url(#c${id})"/>`;
  if(sh.pallu) s+=`<path d="${sh.pallu}" fill="${mix(col,"#000000",0.05)}" stroke="${edge}" stroke-width="1"/><rect width="300" height="372" fill="url(#p${id})" opacity=".9" clip-path="url(#k${id})"/>`;
  if(sh.yoke&&!back){ const [cx,cy,r]=sh.yoke; s+=`<g clip-path="url(#c${id})"><circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#d${id})" opacity=".9"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${t}" stroke-width="1.5" stroke-dasharray="3 3"/></g>`; }
  if(sh.waist) s+=`<path d="M92 ${sh.waist} L208 ${sh.waist}" stroke="${t}" stroke-width="2" stroke-dasharray="1 4" stroke-linecap="round"/>`;
  const hb=sh.drape?36:26;
  s+=`<rect x="0" y="${sh.hem-hb}" width="300" height="${hb+16}" fill="url(#b${id})" clip-path="url(#c${id})"/>`;
  if(sh.drape) s+=`<rect x="0" y="64" width="300" height="20" fill="url(#b${id})" clip-path="url(#c${id})" opacity=".8"/>`;
  if(sh.placket&&!back){ const [x,y,w,h]=sh.placket;
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#d${id})"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${t}" stroke-width="1.2" stroke-dasharray="3 2"/>`;
    for(let by=y+14;by<y+h-4;by+=16) s+=`<circle cx="150" cy="${by}" r="2.6" fill="${mix(col,"#ffffff",.6)}" stroke="${edge}" stroke-width=".8"/>`; }
  if(sh.open){ s+=`<path d="M150 66 L150 ${sh.hem}" stroke="${edge}" stroke-width="1.4"/>`;
    if(!back){ for(let by=92;by<sh.hem-10;by+=28) s+=`<circle cx="153" cy="${by}" r="3" fill="${mix(col,"#ffffff",.55)}" stroke="${edge}" stroke-width=".8"/>`;
      s+=`<path d="M100 132 L128 130" stroke="${edge}" stroke-width="1.6"/>`; } }
  if(sh.collar){ s+=`<path d="M124 52 Q150 46 176 52 L178 66 Q150 60 122 66 Z" fill="${col}" stroke="${edge}" stroke-width="1.2"/>`;
    if(!back) for(let x=128;x<=172;x+=6) s+=`<circle cx="${x}" cy="${57+Math.abs(150-x)*.03}" r="1.3" fill="${t}"/>`; }
  if(sh.neck){ const [x1,y1,qx,qy,x2,y2]=sh.neck;
    s+=`<path d="M${x1} ${y1} Q${qx} ${back?y1+10:qy} ${x2} ${y2}" fill="${dark}" stroke="${edge}" stroke-width="1.2"/>`;
    if(!back) for(let i=1;i<10;i++){ const u=i/10, x=(1-u)*(1-u)*x1+2*u*(1-u)*qx+u*u*x2, y=(1-u)*(1-u)*y1+2*u*(1-u)*(qy+8)+u*u*(y2+8); s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="1.8" fill="${t}"/>`; } }
  s+=`<path d="${sh.folds}" fill="none" stroke="${fold}" stroke-width="1.1" opacity=".55"/>`;
  if(sh.narrow) for(let x=92;x<=208;x+=9) s+=`<path d="M${x} ${sh.hem-2} l0 14" stroke="${edge}" stroke-width="1.3"/>`;
  return s+`</svg>`;
}

      ${t.discount?`<div class="srow disc"><span>${db.coupon} · <button class="link" data-act="rmcoupon" style="font-size:12px">remove</button></span><b class="num">−${inr(t.discount)}</b></div>`:""}
      <div class="srow"><span>Shipping</span><b class="num">${t.shipping?inr(t.shipping):"Free"}</b></div>
      ${left?`<div class="hint">Add ${inr(left)} more for free shipping.</div>`:""}
      <div class="srow total"><span>Total</span><b class="num">${inr(t.total)}</b></div>
      <form class="coupon" id="couponForm"><input id="coupon" placeholder="Coupon code" aria-label="Coupon code" value="${db.coupon||""}"><button class="btn line sm" type="submit">Apply</button></form>
      <div class="hint" id="couponMsg">Try DEVI10.</div>
      <div class="addr"><b>Deliver to ${esc(pr.name)}</b><br>${esc(pr.address)}, ${esc(pr.city)} ${esc(pr.pin)} · <a class="link" href="#profile-address" style="font-size:12px">Change</a></div>
      <button class="btn block" data-act="place">Place order</button>
      <p class="hint" style="text-align:center;margin:10px 0 0">Demo checkout. No payment is taken.</p></aside></div></div>`;
}
function viewConfirm(o){
  app.innerHTML=`<div class="wrap page"><div class="confirm"><div class="label">Order ${o.id}</div><h1>Thank you, ${esc(db.profile.name.split(" ")[0])}</h1>
    <p class="muted">${o.items.reduce((s,l)=>s+l.qty,0)} piece(s) for <span class="num" style="color:var(--ink)">${inr(o.total)}</span>. Updates go to ${esc(db.profile.email)}.</p>
    <div class="acts"><a class="btn line" href="#profile-orders">View orders</a><a class="btn" href="#home">Keep shopping</a></div></div></div>`;
}
function viewWishlist(){
  const items=db.wishlist.map(id=>PMAP[id]).filter(Boolean);
  app.innerHTML=`<div class="wrap page"><h1 class="ptitle">Wishlist <span class="label num" style="font-family:var(--f-body)">${items.length} saved</span></h1>
    ${items.length?`<div class="grid" style="margin-top:28px">${cards(items,{showSec:true,wishActs:true})}</div>`:`<div class="empty" style="margin-top:24px"><h3>Nothing saved yet</h3><p>Tap the heart on any piece to keep it here.</p></div>`}</div>`;
}
let ptab="details";
function viewProfile(tab){
  if(tab) ptab=tab; const pr=db.profile;
  const tabs=[["details","Details"],["address","Address"],["orders","Orders"]];
  let body="";
  if(ptab==="details") body=`<h2>Your details</h2><p class="muted" style="margin:4px 0 0;font-size:14px">An example profile for this demo.</p>
    <form class="form" id="pform" novalidate>
      <div class="field full"><label for="f-name">Full name</label><input id="f-name" name="name" value="${esc(pr.name)}"></div>
      <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" value="${esc(pr.email)}"></div>
      <div class="field"><label for="f-phone">Mobile</label><input id="f-phone" name="phone" inputmode="tel" value="${esc(pr.phone)}"></div>
      <div class="field"><label for="f-size">Usual size</label><select id="f-size" name="size">${["XS","S","M","L","XL","XXL"].map(s=>`<option ${s===pr.size?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field full"><button class="btn" type="submit">Save</button></div></form>`;
  if(ptab==="address") body=`<h2>Delivery address</h2>
    <form class="form" id="pform" novalidate>
      <div class="field full"><label for="f-addr">Address</label><textarea id="f-addr" name="address">${esc(pr.address)}</textarea></div>
      <div class="field"><label for="f-city">City</label><input id="f-city" name="city" value="${esc(pr.city)}"></div>
      <div class="field"><label for="f-pin">PIN code</label><input id="f-pin" name="pin" inputmode="numeric" maxlength="6" value="${esc(pr.pin)}"></div>
      <div class="field full"><label for="f-state">State</label><select id="f-state" name="state">${["Delhi","Karnataka","Maharashtra","Rajasthan","Tamil Nadu","Telangana","Uttar Pradesh","West Bengal"].map(s=>`<option ${s===pr.state?"selected":""}>${s}</option>`).join("")}</select></div>
      <div class="field full"><button class="btn" type="submit">Save address</button></div></form>`;
  if(ptab==="orders") body=`<h2>Orders</h2><div style="margin-top:18px">${db.orders.length?db.orders.map(o=>`<div class="order"><div class="oh"><span><b style="font-weight:500">${o.id}</b> <span class="muted">· ${new Date(o.date+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}${o.sample?" · example":""}</span></span><span class="st ${o.status==="Delivered"?"ok":""}">${o.status}</span></div>
      <div class="items">${o.items.map(l=>`<a href="#p-${l.id}" title="${esc(PMAP[l.id].name)} · ${esc(l.size)} · ×${l.qty}">${art(PMAP[l.id],l.color)}</a>`).join("")}</div>
      <div class="srow" style="margin-top:8px"><span>${o.items.reduce((s,l)=>s+l.qty,0)} item(s)</span><b class="num">${inr(o.total)}</b></div></div>`).join(""):`<p class="muted">No orders yet.</p>`}</div>`;
  app.innerHTML=`<div class="wrap page"><h1 class="ptitle">Profile</h1><div class="prof">
    <nav class="ptabs" aria-label="Profile sections">${tabs.map(([id,l])=>`<a class="${ptab===id?"on":""}" href="#profile-${id}">${l}${id==="orders"?`<span class="num muted">${db.orders.length}</span>`:""}</a>`).join("")}<button class="reset" data-act="reset">Reset demo data</button></nav>
    <section class="panel">${body}</section></div></div>`;
}
let searchQ="";
async function viewSearch(){
  const list=searchQ?await api.products({q:searchQ}):[];
  app.innerHTML=`<div class="wrap page"><div class="label">Search</div><h1 class="ptitle">${searchQ?`“${esc(searchQ)}”`:"Search"}</h1>
    <div class="bar"><span class="num">${searchQ?`${list.length} result${list.length===1?"":"s"}`:"Type in the search bar above."}</span></div>
    ${list.length?`<div class="grid">${cards(list,{showSec:true})}</div>`:searchQ?`<div class="empty"><h3>No matches</h3><p>Try “kurta”, “silk” or “premium”.</p></div>`:""}</div>`;
}
function viewMissing(){ app.innerHTML=`<div class="wrap page"><div class="empty"><h3>We couldn’t find that page</h3><a class="btn sm" href="#home">Go home</a></div></div>`; }

/* ------------------------------------------------------------------ *
 *  Router
 * ------------------------------------------------------------------ */
async function route(){
  const h=(location.hash||"#home").slice(1)||"home";
  $("#modal").hidden=true; $("#searchbar").hidden=true;
  let navSec=(h.match(/^(women|men)\b/)||[])[1];
  if(h.startsWith("p-")&&PMAP[h.slice(2)]) navSec=PMAP[h.slice(2)].sec;
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("on",a.dataset.nav===navSec));
  const m=h.match(/^(women|men)(?:-(.+))?$/);
  try{
    if(h==="home") await viewHome();
    else if(m) await viewSection(m[1],m[2]||"all");
    else if(h.startsWith("p-")) await viewProduct(h.slice(2));
    else if(h==="cart") await viewCart();
    else if(h==="wishlist") viewWishlist();
    else if(h==="profile") viewProfile();
    else if(h.startsWith("profile-")) viewProfile(h.slice(8));
    else if(h==="search") await viewSearch();
    else viewMissing();
  }catch(e){ console.error(e); viewMissing(); }
  syncBadges();
}
const rerender=()=>{ const y=scrollY; return route().then(()=>scrollTo(0,y)); };
window.addEventListener("hashchange",()=>route().then(()=>scrollTo(0,0)));

/* ------------------------------------------------------------------ *
 *  Events
 * ------------------------------------------------------------------ */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");
  if(!b){ if(e.target.id==="modal") $("#modal").hidden=true; return; }
  const a=b.dataset.act, v=b.dataset.v, id=b.dataset.id, i=+b.dataset.i;
  const keepY=fn=>{ const y=scrollY; fn(); scrollTo(0,y); };
  switch(a){
    case "theme": setTheme(effectiveTheme()==="dark"?"light":"dark"); break;
    case "search": { const sb=$("#searchbar"); sb.hidden=!sb.hidden; b.setAttribute("aria-expanded",!sb.hidden); if(!sb.hidden){ $("#q").value=searchQ; $("#q").focus(); } break; }
    case "wish": { e.preventDefault(); const added=await api.toggleWish(id); syncBadges();
      if(location.hash==="#wishlist") rerender();
      else document.querySelectorAll(`[data-act=wish][data-id="${id}"]`).forEach(el=>{ if(el.classList.contains("heart")||el.classList.contains("wish")){ el.classList.toggle("on",added); el.setAttribute("aria-pressed",added); el.setAttribute("aria-label",(added?"Remove from":"Save to")+" wishlist"); } });
      toast(added?"Saved to wishlist":"Removed from wishlist",added?{href:"#wishlist",label:"View"}:null); break; }
    case "wish-to-bag": { const p=PMAP[id], size=p.sizes.length===1?p.sizes[0]:(p.sizes.includes(db.profile.size)?db.profile.size:"M");
      await api.addToCart({id,color:p.colors[0].name,size}); await api.toggleWish(id); syncBadges(); rerender(); toast(`Moved to bag in size ${size}`,{href:"#cart",label:"View bag"}); break; }
    case "view": pdp.view=v; keepY(()=>renderPDP(PMAP[pdp.id])); break;
    case "color": pdp.color=v; keepY(()=>renderPDP(PMAP[pdp.id])); break;
    case "size": pdp.size=v; pdp.err=""; keepY(()=>renderPDP(PMAP[pdp.id])); break;
    case "add": { if(!pdp.size){ pdp.err="Choose a size first."; keepY(()=>renderPDP(PMAP[id])); return; }
      b.disabled=true; await api.addToCart({id,color:pdp.color,size:pdp.size}); b.disabled=false; syncBadges();
      toast(`Added to bag · ${esc(pdp.color)}, ${esc(pdp.size)}`,{href:"#cart",label:"View bag"}); break; }
    case "sizeguide": sizeGuide(v); break;
    case "close": $("#modal").hidden=true; break;
    case "lqty": await api.updateLine(i,{qty:Math.min(10,db.cart[i].qty+ +v)}); rerender(); break;
    case "lremove": await api.removeLine(i); rerender(); toast("Removed from bag"); break;
    case "lmove": { const l=db.cart[i]; if(!db.wishlist.includes(l.id)) await api.toggleWish(l.id); await api.removeLine(i); rerender(); toast("Moved to wishlist",{href:"#wishlist",label:"View"}); break; }
    case "rmcoupon": await api.removeCoupon(); rerender(); break;
    case "place": { b.disabled=true; b.textContent="Placing order…"; try{ const o=await api.placeOrder(); syncBadges(); viewConfirm(o); scrollTo(0,0); }catch(err){ toast(esc(err.message)); b.disabled=false; b.textContent="Place order"; } break; }
    case "reset": await api.reset(); ptab="details"; pdp.id=null; syncBadges(); toast("Demo data reset"); location.hash="#home"; break;
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="sort"){ sortBy=t.value; await rerender(); }
  if(t.dataset.act==="lsize"){ await api.updateLine(+t.dataset.i,{size:t.value}); rerender(); }
  if(t.dataset.act==="lcolor"){ await api.updateLine(+t.dataset.i,{color:t.value}); rerender(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ $("#modal").hidden=true; $("#searchbar").hidden=true; } });
document.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==="searchForm"){ searchQ=$("#q").value.trim(); $("#searchbar").hidden=true; if(location.hash==="#search") await viewSearch(); else location.hash="#search"; return; }
  if(f.id==="couponForm"){ try{ const c=await api.applyCoupon($("#coupon").value); await rerender(); toast(`${c} applied`); }catch(err){ const m=$("#couponMsg"); m.textContent=err.message; m.style.color="var(--warn)"; } return; }
  if(f.id==="pform"){
    const d=Object.fromEntries(new FormData(f).entries()); f.querySelectorAll(".err").forEach(x=>x.remove());
    const errs={};
    if("name" in d&&!d.name.trim()) errs.name="Enter your name.";
    if("email" in d&&!/^\S+@\S+\.\S+$/.test(d.email)) errs.email="Enter an email like name@example.com.";
    if("phone" in d&&d.phone&&!/^[\d\s+]{10,15}$/.test(d.phone)) errs.phone="Use a 10-digit mobile number.";
    if("address" in d&&!d.address.trim()) errs.address="Enter a street address.";
    if("city" in d&&!d.city.trim()) errs.city="Enter a city.";
    if("pin" in d&&!/^\d{6}$/.test(d.pin)) errs.pin="PIN codes have 6 digits.";
    if(Object.keys(errs).length){ for(const k in errs) f.querySelector(`[name=${k}]`).insertAdjacentHTML("afterend",`<div class="err">${errs[k]}</div>`); return; }
    const btn=f.querySelector("[type=submit]"); btn.disabled=true; btn.textContent="Saving…";
    await api.saveProfile(d); rerender(); toast("Saved");
  }
});

route();
})();
</script>

</body>
</html>
